<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5df88" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8c2c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="50" height="50" rx="10" fill="#181824" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
    <text x="25" y="37" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">L</text>
  </g>
  
  <!-- Brand Name Typography -->
  <text x="75" y="44" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="700" letter-spacing="3" fill="#ffffff">LUMIÈRE</text>
  <text x="76" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="4" fill="url(#goldGrad)">CINEMA LUXE</text>
</svg>
